name: NovaCommand CCTV - Instalador Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compilar aplicación
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --noconsole --onedir `
            --name "NovaCommandCCTV" `
            --icon "assets/favicon.ico" `
            --version-file "file_version_info.txt" `
            --add-data "assets;assets" `
            --collect-all customtkinter `
            --collect-all selenium `
            --collect-all pyautogui `
            --collect-all pyperclip `
            --hidden-import win32com.client `
            --hidden-import pythoncom `
            app.py
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Crear instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup no encontrado: $iscc" }
          & $iscc "installer\NovaCommandCCTV.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: NovaCommand-CCTV-Setup-v1.0.0
          path: installer_output/NovaCommand_CCTV_Setup_v1.0.0.exe
          if-no-files-found: error
